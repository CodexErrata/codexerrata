<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
<title id="title">Nollsummespel — balansvåg</title><desc id="desc">En gammaldags balansvåg med två skålar. Den ena sjunker när den andra stiger.</desc>
<defs>

